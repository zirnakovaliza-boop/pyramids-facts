<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Пирамиды</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2b1b00, #b8860b);
            color: #fff;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 40px;
            text-shadow: 0 0 20px #000;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            background: #d4a574;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        button:hover {
            background: #e6be8a;
        }

        button:disabled {
            opacity: 0.6;
            cursor: default;
        }

        #loader {
            margin: 30px 0;
            font-size: 1.3rem;
            display: none;
        }

        #error {
            color: #ff6b6b;
            margin: 20px;
            display: none;
        }

        .cards {
            max-width: 1000px;
            margin: 40px auto;
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 15px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.3);
        }

        .card h3 {
            margin: 0 0 10px;
            color: #ffd700;
        }
    </style>
</head>

<body>

    <h1>Пирамиды</h1>

    <button id="loadBtn">Загрузить факты</button>
    <div id="loader">Загружаем древние тайны...</div>
    <div id="error"></div>

    <div class="cards" id="cards"></div>
    <script src="Pyramids_fact.js"></script>
</body>

</html>
